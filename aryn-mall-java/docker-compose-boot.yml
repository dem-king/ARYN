services:
  aryn-boot-mysql:
    image: mysql:8.0
    container_name: aryn-boot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: wqy123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - aryn-boot-mysql-data:/var/lib/mysql
      - ./db/boot:/docker-entrypoint-initdb.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower-case-table-names=1
      --max-connections=1024
    networks:
      - aryn-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pwqy123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  aryn-boot-redis:
    image: redis:7-alpine
    container_name: aryn-boot-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass redis
    networks:
      - aryn-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aryn-boot-rocketmq-namesrv:
    image: apache/rocketmq:5.4.0
    container_name: aryn-boot-rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    command: sh mqnamesrv
    networks:
      - aryn-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'health check' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  aryn-boot-rocketmq-broker:
    # 官方 arm64 镜像缺 rocksdb aarch64 native，衍生镜像替换 rocketmq-rocksdb jar（见 Dockerfile）
    build:
      context: ./docker/rocketmq/broker-arm64
      dockerfile: Dockerfile
    image: aryn-rocketmq-broker:5.4.0-arm64
    container_name: aryn-boot-rocketmq-broker
    restart: always
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      TZ: Asia/Shanghai
      NAMESRV_ADDR: aryn-boot-rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    command: sh mqbroker -n aryn-boot-rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.4.0/conf/broker.conf
    networks:
      - aryn-net
    depends_on:
      aryn-boot-rocketmq-namesrv:
        condition: service_healthy

  aryn-boot:
    build:
      context: ./aryn-boot
      dockerfile: Dockerfile
    pull_policy: never
    container_name: aryn-boot
    restart: always
    ports:
      - "9999:9999"
    environment:
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://aryn-boot-mysql:3306/aryn_boot?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: wqy123456
      # 接龙报货 AI 助手（OpenAI 兼容，默认 DeepSeek）：在 aryn-mall-java/.env 里放 AI_API_KEY=xxx 即启用
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      # AI 别名召回（缺品备胎）：向量召回未生效时用它兜底，走同一个 DeepSeek key
      AI_ALIAS_RECALL_ENABLED: ${AI_ALIAS_RECALL_ENABLED:-false}
      # 目录向量召回（缺品主路径，默认智谱 embedding-3）：AI_EMBEDDING_API_KEY 留空时走纯字面匹配
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_ENABLED: ${AI_EMBEDDING_ENABLED:-true}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-embedding-3}
      # 相似度阈值用 2026-10-11 真实目录标定值：应召回对 0.80+，无关对 P50=0.62/P90=0.68/最高 0.785
      AI_EMBEDDING_SCORE_THRESHOLD: ${AI_EMBEDDING_SCORE_THRESHOLD:-0.68}
      AI_EMBEDDING_TOP_K: ${AI_EMBEDDING_TOP_K:-6}
      SPRING_DATA_REDIS_HOST: aryn-boot-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis
      ROCKETMQ_NAME_SERVER: aryn-boot-rocketmq-namesrv:9876
      # 容器内 localhost:8081 指向自身而非调度中心，必须用服务名访问
      XXL_JOB_ADMINADDRESSES: http://aryn-boot-xxl-job-admin:8081/xxl-job-admin
    volumes:
      - boot-storage:/data/aryn/uploads
    networks:
      - aryn-net
    depends_on:
      aryn-boot-mysql:
        condition: service_healthy
      aryn-boot-redis:
        condition: service_healthy
      aryn-boot-rocketmq-namesrv:
        condition: service_healthy

  aryn-boot-xxl-job-admin:
    build:
      context: ../xxl-job-3.2.0/xxl-job-admin
      dockerfile: Dockerfile
    pull_policy: never
    container_name: aryn-boot-xxl-job-admin
    restart: always
    ports:
      - "8081:8081"
    environment:
      # 避免手工 docker run 传参时出现字面量反斜杠转义（autoReconnect=true\ 会被驱动判为非法值）
      SPRING_DATASOURCE_URL: jdbc:mysql://aryn-boot-mysql:3306/aryn_boot_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: wqy123456
      XXL_JOB_ACCESSTOKEN: hxsadadasdasdasda
    networks:
      - aryn-net
    depends_on:
      aryn-boot-mysql:
        condition: service_healthy

networks:
  aryn-net:
    name: aryn-net
    driver: bridge

volumes:
  aryn-boot-mysql-data:
  redis-data:
  boot-storage:
