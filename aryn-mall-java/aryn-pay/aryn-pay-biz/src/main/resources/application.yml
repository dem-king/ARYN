server:
  port: 6900

spring:
  application:
    name: @artifactId@
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
  config:
    import:
      - optional:nacos:application-@profiles.active@.yml
      - optional:nacos:${spring.application.name}-@profiles.active@.yml

# IP 归属地：ip2region 离线库优先、查询失败回退第三方 HTTP；xdb 由 XXL-JOB 每日校验更新
aryn:
  pay:
    credential:
      master-key: ${ARYN_PAY_CREDENTIAL_MASTER_KEY:}
      key-id: ${ARYN_PAY_CREDENTIAL_KEY_ID:primary}
      previous-keys: ${ARYN_PAY_CREDENTIAL_PREVIOUS_KEYS:}
      max-material-bytes: ${ARYN_PAY_CREDENTIAL_MAX_BYTES:262144}
    callback:
      allow-http: ${ARYN_PAY_CALLBACK_ALLOW_HTTP:false}
      allow-private: ${ARYN_PAY_CALLBACK_ALLOW_PRIVATE:false}
    allowed-return-hosts: ${ARYN_PAY_ALLOWED_RETURN_HOSTS:}
    client-ip:
      trusted-proxy: ${ARYN_PAY_TRUSTED_PROXY:false}
    outbox:
      relay-interval-ms: ${ARYN_PAY_OUTBOX_RELAY_INTERVAL_MS:5000}
      batch-size: ${ARYN_PAY_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${ARYN_PAY_OUTBOX_MAX_ATTEMPTS:20}
    alipay:
      gateway-prod: ${ARYN_PAY_ALIPAY_GATEWAY_PROD:https://openapi.alipay.com/gateway.do}
      gateway-sandbox: ${ARYN_PAY_ALIPAY_GATEWAY_SANDBOX:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  ip:
    enabled: ${ARYN_IP_ENABLED:true}
    fallback-http: ${ARYN_IP_FALLBACK_HTTP:true}
    ip2region:
      # 外部可写目录（热更新落盘位置）；多副本/多服务可挂同一共享卷，留空默认 ~/.aryn/ip2region
      data-dir: ${ARYN_IP2REGION_DATA_DIR:}
      cache-policy: vindex
      searchers: 20
    refresh:
      enabled: ${ARYN_IP_REFRESH_ENABLED:true}
      # 默认跟随 ip2region master（官方数据不定期更新）；境内可换 Gitee 镜像，商用换成已购离线数据
      source-url: ${ARYN_IP2REGION_XDB_URL:https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data/ip2region_v4.xdb}
      timeout-ms: ${ARYN_IP2REGION_TIMEOUT_MS:60000}
