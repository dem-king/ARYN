spring:
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # password: ${REDIS_PASSWORD:}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:1}
  # 数据库相关配置
  datasource:
    dynamic:
      primary: master   # 指定默认数据源
      datasource:
        master:         # 注意，这里要嵌套在 datasource 下
          url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aryn_boot}?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:root123456}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource

rocketmq:
  name-server: localhost:9876
  producer:
    group: producer_group
    retry-times-when-send-failed: 5
    send-message-timeout: 5000

aj:
  captcha:
    cache-type: redis
    water-mark: aryn

encode:
  key: ${ENCODE_KEY:VyBcekSelErhMYN4}
  # CBC 模式 IV，须与前端 apps/web-ele/src/utils/aes.ts 的 DEFAULT_IV 一致
  iv: ${ENCODE_IV:aryn_iv_key_2025}

sms:
  ali:
    accessKeyId: ${SMS_ALI_ACCESS_KEY_ID:xxxxxxxxx}
    accessKeySecret: ${SMS_ALI_ACCESS_KEY_SECRET:xxxxxxxxxxxxxxxx}
    loginTemplateCode: ${SMS_ALI_LOGIN_TEMPLATE_CODE:SMS_xxxxxxxxxx}
    loginSignName: ${SMS_ALI_LOGIN_SIGN_NAME:悦航购}

xxl:
  job:
    adminAddresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:hxsadadasdasdasda}

meilisearch:
  host: http://localhost:7700
  apiKey: ${MEILI_MASTER_KEY:aryn_dev_key_2026}

demo:
  enabled: false

cert-dir: C:\Download

#knife4j配置
knife4j:
  #是否启用增强设置
  enable: false
  #是否启用生产环境屏蔽
  production: false
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn


