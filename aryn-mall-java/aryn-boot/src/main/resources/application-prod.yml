spring:
  servlet:
    multipart:
      maxFileSize: 100MB
      maxRequestSize: 100MB
  cache:
    type: redis # 缓存类型 Redis
  data:
    redis:
      host: ${REDIS_HOST}
#      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT:6379}

  # 数据库相关配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:Aetheryn_boot}?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: producer_group
    retry-times-when-send-failed: 5
    send-message-timeout: 5000

aj:
  captcha:
    cache-type: redis
    water-mark: aryn

encode:
  key: ${ENCODE_KEY}
  # CBC 模式 IV，须与前端 apps/web-ele/src/utils/aes.ts 的 DEFAULT_IV 一致
  iv: ${ENCODE_IV:aryn_iv_key_2025}

sms:
  ali:
    accessKeyId: ${SMS_ALI_ACCESS_KEY_ID}
    accessKeySecret: ${SMS_ALI_ACCESS_KEY_SECRET}
    loginTemplateCode: ${SMS_ALI_LOGIN_TEMPLATE_CODE}
    loginSignName: ${SMS_ALI_LOGIN_SIGN_NAME:悦航购}

xxl:
  job:
    adminAddresses: ${XXL_JOB_ADMIN_ADDRESSES}
    accessToken: ${XXL_JOB_ACCESS_TOKEN}

demo:
  enabled: true

cert-dir: /root/cert

#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #是否启用生产环境屏蔽
  production: true
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn

