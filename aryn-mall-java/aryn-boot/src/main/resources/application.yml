  swagger:
    enabled: true
    title: Hx Mall API
    description: Hx Mall API Document
    version: v3.1.0
    author: aryn
    email: aryntech@163.com
    license: MIT
    license-url: https://gitee.com/lijiaxing_boy/aryn-mall/blob/master/LICENSE

# 代码生成
gen:
  # 作者
  author: aryn
  # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
  packageName: com.aryn.cloud
  # 自动去除表前缀，默认是false
  autoRemovePre: false
  # 表前缀（生成类名不会包含表前缀，多个用逗号分隔）
  tablePrefix: sys_
  # 是否允许生成文件覆盖到本地（自定义路径），默认不允许
  allowOverwrite: false

distribution:
  withdraw:
    account-key: ${DISTRIBUTION_WITHDRAW_ACCOUNT_KEY:}

# 接龙报货 AI 助手（OpenAI 兼容协议，默认 DeepSeek；GLM 等同协议供应商换 base-url/model 即可）。
# api-key 留空时 isAvailable=false，整条链路自动走纯规则解析/匹配，零影响。
# key 建议经环境变量注入（compose-boot.yml 已透传 AI_API_KEY，可放 aryn-mall-java/.env）。
sms:
  rate-limit:
    # boot 单体通常直接暴露 9999，客户端可伪造 X-Forwarded-For 绕过 IP 频控，
    # 因此默认不信任代理头、用 remoteAddr；cloud 模式在 upms 的 nacos 配置里置 true（网关追加上下文）
    trust-forwarded-headers: false

aryn:
  chain-ai:
    enabled: ${AI_ENABLED:true}
    # AI 别名召回（缺品备胎，默认关）：缺品候选主路径是商品域向量召回
    alias-recall-enabled: ${AI_ALIAS_RECALL_ENABLED:false}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    timeout-ms: ${AI_TIMEOUT_MS:20000}
  # 目录向量召回（缺品主路径）：与 product-biz 同配置，DeepSeek 无 embeddings 接口，默认智谱
  embedding:
    enabled: ${AI_EMBEDDING_ENABLED:true}
    api-key: ${AI_EMBEDDING_API_KEY:}
    model: ${AI_EMBEDDING_MODEL:embedding-3}
    base-url: ${AI_EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    timeout-ms: ${AI_EMBEDDING_TIMEOUT_MS:20000}
    recall-top-k: ${AI_EMBEDDING_TOP_K:6}
    score-threshold: ${AI_EMBEDDING_SCORE_THRESHOLD:0.55}
    catalog-ttl-minutes: ${AI_EMBEDDING_CATALOG_TTL_MINUTES:60}

# 营销优惠叠加策略（活动价 × 优惠券 × 积分抵现）：
# enabled=false 时所有活动商品视为可叠（灰度回滚开关，等同现网行为）；
# 最低实付兜底防止券把商品打到 0 元单（悦航购自定策略，非行业惯例）。
promotion:
  stack-policy:
    enabled: ${PROMOTION_STACK_POLICY_ENABLED:true}
    min-payable-enabled: ${PROMOTION_MIN_PAYABLE_ENABLED:true}
    min-payable-amount: ${PROMOTION_MIN_PAYABLE_AMOUNT:0.01}
