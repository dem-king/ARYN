server:
  port: 9999
  servlet:
    context-path: /boot
spring:
  application:
    name: @project.artifactId@
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  main:
    allow-bean-definition-overriding: true # 允许覆盖bean定义
  profiles:
    active: dev  # 单体环境

jackson:
  default-property-inclusion: always
  date-format: yyyy-mm-dd hh:mm:ss

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  token-style: uuid
  is-log: true
  is-print: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  type-handlers-package: com.aryn.cloud.common.myabtis.handler
  global-config:
    banner: false
    db-config:
      id-type: auto
      where-strategy: not_empty
      insert-strategy: not_empty
      update-strategy: not_null
  configuration:
    jdbc-type-for-null: 'null'
    call-setters-on-nulls: true
    shrink-whitespaces-in-sql: true

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'boot'
      paths-to-match: '/**'
      #生成文档所需的扫包路径，一般为启动类目录
      packages-to-scan: com.aryn.cloud

logging:
  level:
    com.aryn.cloud.upms.mapper: DEBUG
    com.aryn.cloud.user.mapper: DEBUG
    com.aryn.cloud.distribution.mapper: DEBUG
    com.aryn.cloud.order.mapper: DEBUG
    com.aryn.cloud.pay.mapper: DEBUG
    com.aryn.cloud.product.mapper: DEBUG
    com.aryn.cloud.promotion.mapper: DEBUG
    com.aryn.cloud.message.mapper: DEBUG
    org.mybatis.spring.SqlSessionFactoryBean: DEBUG

callback:
  prefix:
    pay: boot
    logistics: boot

dubbo:
  scan:
    base-packages: com.aryn.cloud
  application:
    name: aryn-boot
    # 暂时解决dubbo 反序列化问题
    serialize-check-status: WARN
  protocol:
    name: injvm
    port: -1
  registry:
    address: N/A
  provider:
    filter: -exception
seata:
  enabled: false

secure:
  ignore:
    urls:
      - /swagger-resources/**
      - /webjars/**
