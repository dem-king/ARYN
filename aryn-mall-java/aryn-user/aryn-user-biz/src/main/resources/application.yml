server:
  port: 7527

spring:
  application:
    name: @artifactId@
  cloud:
    nacos:
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
  config:
    import:
      - optional:nacos:application-@profiles.active@.yml
      - optional:nacos:${spring.application.name}-@profiles.active@.yml

# IP 归属地：ip2region 离线库优先、查询失败回退第三方 HTTP；xdb 由 XXL-JOB 每日校验更新
aryn:
  ip:
    enabled: ${ARYN_IP_ENABLED:true}
    fallback-http: ${ARYN_IP_FALLBACK_HTTP:true}
    ip2region:
      # 外部可写目录（热更新落盘位置）；多副本/多服务可挂同一共享卷，留空默认 ~/.aryn/ip2region
      data-dir: ${ARYN_IP2REGION_DATA_DIR:}
      cache-policy: vindex
      searchers: 20
    refresh:
      enabled: ${ARYN_IP_REFRESH_ENABLED:true}
      # 默认跟随 ip2region master（官方数据不定期更新）；境内可换 Gitee 镜像，商用换成已购离线数据
      source-url: ${ARYN_IP2REGION_XDB_URL:https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data/ip2region_v4.xdb}
      timeout-ms: ${ARYN_IP2REGION_TIMEOUT_MS:60000}

# 微信小程序环境版本（推广码生成用）：release 正式版 / trial 体验版 / develop 开发版。
# cloud 模式以 Nacos aryn-user-biz-{profile}.yml 为准（升级脚本 db/cloud/209sales_qrcode_nacos_config.sql），
# 此处为无 Nacos 时的兜底默认值，可用 WX_MINIAPP_ENV_VERSION 环境变量覆盖。
wx:
  miniapp:
    env-version: ${WX_MINIAPP_ENV_VERSION:release}
