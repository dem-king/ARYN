name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aryn-mall-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node db/boot/build-full-sql.mjs
      - run: node db/boot/verify-full-sql.mjs
      - run: mvn test -pl aryn-boot -am

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aryn-mall-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:type
      - run: pnpm test:unit
      - run: pnpm lint
      - run: pnpm build:ele
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  uniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aryn-mall-uniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build:h5
      - run: pnpm build:mp-weixin
