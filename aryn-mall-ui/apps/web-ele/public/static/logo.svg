<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B5EA7"/>
      <stop offset="35%" stop-color="#5B7FD5"/>
      <stop offset="100%" stop-color="#3AAFE0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Capital A - larger, accent color -->
  <text x="0" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="700" fill="url(#accentGrad)" letter-spacing="-1">A</text>
  <!-- etheryn - gradient fill -->
  <text x="48" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="300" fill="url(#textGrad)" letter-spacing="1">etheryn</text>
  <!-- Decorative dot above A -->
  <circle cx="28" cy="8" r="4" fill="url(#accentGrad)" opacity="0.7"/>
  <!-- Subtle underline accent -->
  <rect x="0" y="78" width="46" height="2.5" rx="1.25" fill="url(#accentGrad)" opacity="0.5"/>
  <rect x="48" y="78" width="180" height="1.5" rx="0.75" fill="url(#textGrad)" opacity="0.25"/>
</svg>