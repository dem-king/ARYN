# ============================================================================
# 悦航购管理端 Web（aryn-mall-ui / web-ele）Nginx 站点配置 —— 80 端口 / 明文 HTTP
# ----------------------------------------------------------------------------
# 加载方式：Dockerfile 将本文件 COPY 到 /etc/nginx/conf.d/aryn-ui.conf，
#           由 nginx 主配置中的 `include /etc/nginx/conf.d/*.conf;`（http 上下文）加载。
#           因此本文件顶层直接写 server {} 块，不要再包 http {}。
#
# 要点：
#   - 本文件只监听 80（明文 HTTP），是仓库默认部署形态；
#   - 生产 HTTPS/TLS 模板见同目录 aryn-ui-https.conf.example，
#     但「仓库里有 HTTPS 模板」≠「生产已启用 TLS」，必须核实真实入口（见 README.md）；
#   - boot 单体模式下 /api 反代到 http://aryn-boot:9999/，路径改写（/xxx → /boot/xxx）
#     由前端 rewriteBootUrl 完成，Nginx 绝对不能再拼 /boot 前缀。
# ============================================================================

server {
    listen 80;
    server_name localhost;

    # ===================== 基础安全 =====================
    # 隐藏 nginx 版本号，减少指纹信息
    server_tokens off;

    # 与后端对齐：aryn-boot application-prod.yml 中
    # spring.servlet.multipart.max-file-size / max-request-size = 100MB，
    # 这里必须一致，否则大文件上传在 Nginx 层就被 413 拦截。
    client_max_body_size 100m;

    # ===================== gzip（保留原有配置） =====================
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 9;
    gzip_types text/plain text/xml text/css application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";
    gzip_vary on;

    # ===================== 全局安全响应头 =====================
    # nginx 的 add_header 继承规则：一旦更内层（location / if in location）声明了
    # add_header，就不再继承上层 add_header。因此下面每个自己声明了 add_header 的
    # location 都必须把 4 个安全头再声明一遍（本文件已逐一处理，改动时勿遗漏）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # ===================== API 反向代理（boot 单体模式） =====================
    # 前端生产同源请求 /api/xxx：
    #   - cloud 微服务模式：/api/{domain}/xxx → http://aryn-boot:9999/{domain}/xxx
    #   - boot 单体模式：前端已把 /api/{domain}/xxx 改写为 /api/boot/{domain}/xxx，
    #     Nginx 只做「去掉 /api 前缀」的转发（proxy_pass 末尾的 /），
    #     即 /api/boot/upms/user/page → /boot/upms/user/page，不要再加 /boot。
    location ^~ /api/ {
        # ----- CORS（只保留这一组，禁止再出现 `Access-Control-Allow-Origin '*'`）-----
        # 带凭证（Cookie / satoken 请求头）的跨域必须回显具体 Origin，
        # 且 Access-Control-Allow-Origin 与 Access-Control-Allow-Credentials 必须成对出现；
        # 同一响应输出两个不同的 ACAO 头会被浏览器直接判为非法（之前 '*' + $http_origin
        # 的重复写法就是这个问题）。管理端生产推荐同源部署，同源请求不会触发 CORS 校验。
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;

        # 上面声明了 add_header 已切断 server 级安全头继承，这里显式补齐。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ----- OPTIONS 预检 -----
        # if 块内声明 add_header 同样会覆盖本 location 的 add_header，
        # 所以预检分支必须把 CORS 与安全头一并再声明一次，否则预检响应缺少 ACAO。
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            # 除通用头外，包含管理端实际发送的自定义头：Authorization / satoken / tenant-id / Accept-Language
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,satoken,tenant-id,Accept-Language" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
            add_header Access-Control-Max-Age "1728000" always;
            add_header Vary "Origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            return 204;
        }

        # ----- 剥离上游 CORS 头，保证全链路只有一组 ACAO -----
        # aryn-boot 的 SaTokenConfigure 在 Origin 命中 cors allowed-origins 时也会
        # 自己 setHeader(Access-Control-Allow-Origin)，与本文件的 add_header 叠加会
        # 产生两个 ACAO 头，浏览器同样按 CORS 失败处理。这里统一剥离上游 CORS 头，
        # 由 Nginx 作为唯一 CORS 出口（OPTIONS 预检在上面的 if 分支直接 204，不到上游）。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Access-Control-Expose-Headers;

        # ----- 转发到 aryn-boot（保持原有语义：超时 / Upgrade / 真实 IP 头）-----
        proxy_pass http://aryn-boot:9999/;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS 终止在 Nginx 时（HTTPS 模板）后端可通过该头感知原始协议；80 下为 http。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # WebSocket 升级头（保留原配置）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ===================== 静态资源缓存 =====================
    # Vite 构建产物带内容 hash，可长缓存；index.html 另行处理保证发布即生效。
    # 这里只用 expires（不写 add_header），不会切断 server 级安全头继承。
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # SPA 入口不缓存（hash 路由下页面本身不参与路由，但保证发版后立即拿到新资源清单）
    location = /index.html {
        expires -1; # Cache-Control: no-cache
    }

    # ===================== SPA 前端路由回退 =====================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===================== 阻止敏感端点 =====================
    # /actuator 只允许内网访问，对外一律 403（保留原策略）
    location ~ /actuator {
        return 403;
    }
}
